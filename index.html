<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>🍳 식사게임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ MENU ═══ -->
<div id="screen-menu" class="screen active">
  <div class="menu-wrap">
    <div class="menu-title">
      <span class="menu-icon">🍳</span>
      <h1>식사게임</h1>
      <p>제한시간 안에 맛있는 요리를 만들어요!</p>
    </div>
    <div class="menu-choose">
      <h2>어떤 요리를 할까요?</h2>
      <div class="cuis-row">
        <button class="cuis-btn k" onclick="selectCuisine('korean')">
          <span>🥘</span><strong>한식</strong>
          <small>김치찌개 · 비빔밥 · 라면 · 제육볶음</small>
        </button>
        <button class="cuis-btn c" onclick="selectCuisine('chinese')">
          <span>🥡</span><strong>중식</strong>
          <small>짜장면 · 볶음밥 · 탕수육 · 마파두부</small>
        </button>
        <button class="cuis-btn w" onclick="selectCuisine('western')">
          <span>🍔</span><strong>양식</strong>
          <small>파스타 · 햄버거 · 피자 · 샐러드</small>
        </button>
      </div>
    </div>
    <div class="how-to">
      <h3>📖 게임 방법</h3>
      <div class="how-steps">
        <div><span>1</span> 카운터에 손님 주문이 들어와요</div>
        <div><span>2</span> 레시피 보고 재료를 클릭하면 냄비에 들어가요!</div>
        <div><span>3</span> 재료가 모이면 🔥 조리하기 — 실제로 조리돼요!</div>
        <div><span>4</span> 완성되면 🍽️ 서빙해서 점수를 얻으세요!</div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ GAME ═══ -->
<div id="screen-game" class="screen">

  <!-- Top bar -->
  <div class="top-bar">
    <div class="tb-score">
      <small>점수</small>
      <span id="score">0</span>
    </div>
    <div class="tb-timer">
      <div class="timer-track"><div id="timer-fill" class="timer-fill"></div></div>
      <span id="timer-text">3:00</span>
    </div>
    <div id="combo-box" class="tb-combo">🔥 <span id="combo-num">2</span>콤보</div>
    <button class="tb-home" onclick="backToMenu()">🏠</button>
  </div>

  <!-- Restaurant scene -->
  <div class="rs" id="rs">
    <!-- Static bg -->
    <div class="rs-bg">
      <div class="rs-lamp" style="left:20%">💡</div>
      <div class="rs-lamp" style="left:50%">💡</div>
      <div class="rs-lamp" style="right:15%">💡</div>
      <div class="rs-deco" style="left:3%">🪴</div>
      <div class="rs-deco" style="right:3%">🪴</div>
      <div class="rs-win" style="left:8%">🪟</div>
      <div class="rs-win" style="right:8%">🪟</div>
      <div class="rs-clock" style="left:50%;transform:translateX(-50%)">🕐</div>
    </div>

    <!-- Tables -->
    <div class="rs-tables">
      <div class="rs-table">
        <div class="tbl"></div>
        <div class="tbl-custs">
          <span class="sc" style="--d:0s">👩</span>
          <span class="sc" style="--d:0.6s">👨</span>
        </div>
      </div>
      <div class="rs-table center-tbl">
        <div class="tbl"></div>
        <div class="tbl-custs">
          <span class="sc" style="--d:0.3s">🧑</span>
          <span class="sc" style="--d:1s">👴</span>
        </div>
      </div>
      <div class="rs-table">
        <div class="tbl"></div>
        <div class="tbl-custs">
          <span class="sc" style="--d:0.8s">👧</span>
        </div>
      </div>
    </div>

    <!-- Walkers (JS injects) -->
    <div class="rs-walkers" id="rs-walkers"></div>

    <!-- Counter (order area) -->
    <div class="rs-counter">
      <div class="counter-surface">
        <div class="counter-label">주문 카운터</div>
        <div id="order-ticket-wrap" class="order-ticket-wrap">
          <div class="order-ticket" id="order-ticket">
            <span class="ot-num">#1</span>
            <span id="ot-emoji" class="ot-emoji">🍲</span>
            <span id="ot-name" class="ot-name">김치찌개</span>
            <span id="ot-cust" class="ot-cust">👨</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Kitchen -->
  <div class="kitchen">

    <!-- Left: recipe + timer -->
    <div class="k-left">
      <div class="cust-timer-wrap">
        <div id="cust-timer-fill" class="cust-timer-fill"></div>
      </div>
      <div class="recipe-card">
        <div class="rc-title">📋 레시피</div>
        <div id="recipe-list" class="recipe-list"></div>
      </div>
    </div>

    <!-- Right: cooking station -->
    <div class="k-right">
      <div class="stove" id="stove">

        <!-- Steam -->
        <div class="steam-zone" id="steam-zone"></div>

        <!-- Pot -->
        <div class="pot-asm" id="pot-asm">
          <div class="pot-lid" id="pot-lid">
            <div class="pot-lid-knob"></div>
          </div>
          <div class="pot-outer">
            <div class="pot-handle-l"></div>
            <div class="pot-body">
              <div class="pot-inside" id="pot-inside">
                <span class="pot-ph">냄비가 비어있어요</span>
              </div>
            </div>
            <div class="pot-handle-r"></div>
          </div>
        </div>

        <!-- Burner -->
        <div class="burner" id="burner">
          <div class="br br1"></div>
          <div class="br br2"></div>
          <div class="br br3"></div>
        </div>

        <!-- Finished dish overlay -->
        <div class="dish-overlay" id="dish-overlay">
          <div id="dish-sparkles" class="dish-sparkles"></div>
          <span id="dish-emoji" class="dish-emoji"></span>
        </div>

      </div><!-- /stove -->

      <div class="cook-btns">
        <button id="cook-btn" class="cook-btn hidden" onclick="cookDish()">🔥 조리하기!</button>
        <button id="serve-btn" class="serve-btn hidden" onclick="serveDish()">🍽️ 서빙!</button>
      </div>
    </div>

  </div><!-- /kitchen -->

  <!-- Ingredients -->
  <div class="ing-panel">
    <div class="ing-label">🧺 재료 선택 — 클릭하면 냄비에 들어가요!</div>
    <div id="ing-grid" class="ing-grid"></div>
  </div>

  <!-- Flying ingredient -->
  <div id="flyer" class="flyer hidden"></div>

  <!-- Feedback -->
  <div id="feedback" class="feedback hidden">
    <div id="fb-inner" class="fb-inner"></div>
  </div>

</div><!-- /screen-game -->

<!-- ═══ GAME OVER ═══ -->
<div id="screen-gameover" class="screen">
  <div class="go-wrap">
    <div class="go-card">
      <div id="go-icon">🎉</div>
      <h1 id="go-title">게임 종료!</h1>
      <div id="go-grade" class="go-grade"></div>
      <div class="go-score-row">
        <span>최종 점수</span>
        <strong id="go-score">0</strong>
        <span>점</span>
      </div>
      <div id="go-stats" class="go-stats"></div>
      <p id="go-msg" class="go-msg"></p>
      <div class="go-btns">
        <button onclick="retryGame()">🔄 다시 도전!</button>
        <button onclick="backToMenu()">🏠 메뉴로</button>
      </div>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
